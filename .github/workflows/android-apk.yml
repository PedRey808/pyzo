name: Android APK

on:
  push:
    paths:
      - 'monopoly/index.html'
      - 'monopoly/peerjs.min.js'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Magnat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Magnat-apk
          path: Magnat.apk

      - name: Publish to the "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Магнат — APK для Android
          body: |
            Последняя сборка игры «Магнат» для Android (8.0+).
            Скачайте **Magnat.apk**, откройте файл на телефоне и разрешите установку из этого источника.
            Сборка: ${{ github.run_number }}, коммит ${{ github.sha }}.
          files: Magnat.apk
          make_latest: true
