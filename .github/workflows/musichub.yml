name: MusicHub build

on:
  push:
    paths:
      - "music_player/**"
      - ".github/workflows/musichub.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musichub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: music_player } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v tests

  windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { working-directory: music_player } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pywebview pyinstaller
      - name: Build MusicHub.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MusicHub
          --add-data "musichub/static;musichub/static"
          --collect-submodules uvicorn
          --collect-submodules yandex_music
          --collect-submodules musichub
          --collect-data certifi
          run.py
      - name: Smoke test (server answers)
        shell: pwsh
        run: |
          $env:MUSICHUB_HOME = "$env:RUNNER_TEMP\mh"
          $p = Start-Process -FilePath dist\MusicHub.exe -ArgumentList "--no-browser","--port","8790" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8790/api/sources; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "$env:MUSICHUB_HOME\musichub.log") { Get-Content "$env:MUSICHUB_HOME\musichub.log" }
          if (-not $ok) { throw "MusicHub.exe did not start" }
          Write-Output $r.Content
      - uses: actions/upload-artifact@v4
        with:
          name: MusicHub-windows
          path: music_player/dist/MusicHub.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build APK
        run: gradle --no-daemon -p music_player/android assembleDebug
      - run: cp music_player/android/app/build/outputs/apk/debug/app-debug.apk MusicHub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicHub-android
          path: MusicHub.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - name: Publish "musichub-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: musichub-latest
          name: MusicHub — последняя сборка
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Готовые файлы MusicHub (сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}).

            * **MusicHub.exe** — Windows 10/11. Просто запустите (SmartScreen: «Подробнее» → «Выполнить в любом случае»).
            * **MusicHub.apk** — Android 7+. Откройте файл на телефоне и разрешите установку из этого источника.
          files: |
            out/MusicHub.exe
            out/MusicHub.apk
